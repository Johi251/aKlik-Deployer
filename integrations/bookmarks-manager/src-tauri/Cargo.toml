[package]
name = "bookmarks-dynamic-manager"
version = "1.2.0"
description = "Lokale Lesezeichen-Verwaltung mit automatischer Multi-Kategorisierung"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bookmarks_dynamic_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

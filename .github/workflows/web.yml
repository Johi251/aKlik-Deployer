name: Build web and add-ons
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: integrations/bookmarks-manager
      - run: bun run check
      - run: bun test
      - run: bun run release:web
      - uses: actions/upload-artifact@v4
        with:
          name: aKlik-Deployer-web
          path: sites/aklik-deployer-online/dist/
          if-no-files-found: error
          retention-days: 1
